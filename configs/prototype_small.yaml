# Phase 1 prototype architecture — the single source of truth for model shape.
# ~211K trainable parameters at vocab_size=16 (207K at vocab_size=2).
# The exact count is always measured from the instantiated model, never stored here.
#
# Experiment configs reference this file with:
#   model:
#     base: prototype_small
#     overrides: {vocab_size: ...}

model:
  vocab_size: 16
  max_seq_len: 64
  d_model: 128
  num_heads: 4
  d_ff: 512
  alpha: 0.9      # EMA factor for z_H
  dropout: 0.0

# Recursive depth used by scripts that need a single K (validation / viva demo).
default_k: 4
