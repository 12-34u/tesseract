# Full Phase 2 grid — DEFINED BUT NOT RUN. scripts/phase2_grid.py refuses to
# start without --confirm-full-grid, passed gates and a pilot report.
#
# Cells (from benchmark.yaml):
#   tesseract:      {main, c1_span, c2_word} × T × K × seeds = 144
#   Z60 ladder:     tesseract, main × T × K × seeds          = 48
#   unrolled:       main × T × L × seeds                     = 48
#   param_matched:  main × T × L × seeds                     = 48
#   width_scaled:   main × T × seeds (compute ≈ K=8)         = 12
# The fixed step budget comes from the pilot report.

experiment:
  name: phase2_grid
  output_dir: phase2/grid
  seed: 0
  device: auto

model:
  base: prototype_small
  overrides:
    vocab_size: 60

benchmark: phase2/benchmark

optimizer:
  name: adamw
  learning_rate: 0.001       # OPEN ITEM: the design requires a per-family LR sweep at T=2 before the grid
  weight_decay: 0.01

batch_size: 128
eval_every: 250
eval_batch_size: 2048

pilot_output_dir: phase2/pilot_p1
families: [tesseract, unrolled, param_matched, width_scaled]
include_ablation_groups: true
