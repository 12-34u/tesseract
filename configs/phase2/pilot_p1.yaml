# Pilot P1 (PHASE2_BENCHMARK_DESIGN.md §6, with Amendment 01 in force).
# A feasibility/capacity pilot. Values are unchanged from the pre-registered
# pilot configuration.
#
# Stage A: calibrate the fixed step budget. Train Tesseract K=1 on the main A5
#          task at T=1 until validation exact match >= 99 %, evaluated every
#          eval_every steps. Safety limit: max_steps.
#          Budget = exactly 2 × steps-to-criterion.
# Stage B: at that budget, with no early stopping: T=1/K=8, T=8/K=1, T=8/K=8.
#          A cell is "at floor" when its best-checkpoint VALIDATION
#          chance-normalised token accuracy < 0.02.
# P1 never evaluates the test split and never uses test data for selection.
# The learning rate is not tuned, and is the same for every cell.

experiment:
  name: phase2_pilot_p1
  output_dir: phase2/pilot_p1
  seed: 0                    # model seed
  device: auto               # this environment has no CUDA-enabled torch → CPU

model:
  base: prototype_small      # Phase 1 architecture, unchanged except vocabulary
  overrides:
    vocab_size: 60

benchmark: phase2/benchmark

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.01

batch_size: 128
eval_every: 250
eval_batch_size: 2048

calibration:
  family: tesseract
  depth: 1
  task: main
  t: 1
  max_steps: 20000           # safety limit
  converge_exact_match: 99.0
  budget_multiplier: 2

floor_cells:
  - {family: tesseract, depth: 8, task: main, t: 1}
  - {family: tesseract, depth: 1, task: main, t: 8}
  - {family: tesseract, depth: 8, task: main, t: 8}

floor_threshold: 0.02
