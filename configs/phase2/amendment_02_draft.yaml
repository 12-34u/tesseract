# Phase 2 Amendment 02 — DRAFT / PRE-FREEZE (PHASE2_BENCHMARK_DESIGN.md §10).
# Decisions D1–D3 were approved on 2026-09-15. The amendment is frozen only after
# the model width and fixed step budget are approved following P1b. While
# `frozen: false`, scripts/phase2_experiment.py refuses to train.

id: amendment_02
date: "2026-09-15"
status: draft
frozen: false

decisions:
  - id: D1
    title: Z60 ladder dropped; §5 decision rule amended
    text: >-
      Z60 is removed from the experiment and from the decision rule. Supports a
      sequential-depth effect only if (1) main Δ(8)=K8−K1 > 0 with a 95 % interval
      excluding 0, (2) main DiD=Δ(8)−Δ(4) > 0 with an interval excluding 0, and
      (3) the main task's mean DiD exceeds C2's while neither C1 Δ(4) nor C1 Δ(8)
      has an interval excluding 0. Span explanation: a C1 Δ interval excludes 0.
      Composition without depth: C2's DiD is at least the main task's.
      Inconclusive: main floor for every K at T=8, K=1 ceiling at T=4, or a mixed
      result. The baselines are interpretive only.
  - id: D2
    title: Per-family learning-rate sweep dropped
    text: >-
      AdamW, lr 1e-3, weight decay 0.01 for every family. No learning-rate tuning.
      Baseline comparisons are conditional on this shared learning rate.
  - id: D3
    title: Parameter-matched head-dimension confound accepted
    text: >-
      The existing parameter matching (fixed heads, reduced head dimension) is kept
      and recorded per run (head_dim, reference_head_dim) in every baseline table.
  - id: D4
    title: Deviations from the original §4 design
    text: >-
      The budget comes from P1b, not P1. Controls and baselines run only at T in
      {4, 8}. Unrolled / param-matched L=1 are not run (identical to Tesseract
      K=1). Test is evaluated after training only, on the best-validation
      checkpoint (primary) and the final checkpoint (sensitivity). Lookup
      coverage is reported analytically. T=1 and T=2 are excluded from the
      primary inference.
  - id: D5
    title: P1b width and budget selection rules (declared before P1b completed)
    text: >-
      Learnable means some K has final chance-normalised validation accuracy
      >= 0.02, a mean over the last 20 evaluations >= 0.02, and final validation
      loss < ln 60. Width: the smallest learnable width, stating whether K=1 is at
      the floor. Budget: the smallest multiple of 5,000 steps at which the
      8-evaluation rolling mean reaches 90 % of its final value; or 20,000 marked
      "not converged" if still rising. If neither width is learnable, do not
      proceed.

decision_rule:
  primary_t_values: [4, 8]
  k_low: 1
  k_high: 8
  ci_level: 0.95
  floor_threshold: 0.02
  tau: 0.9
  score: "test chance-normalised token accuracy; best-validation checkpoint primary, final checkpoint sensitivity"

stage1_review:
  t: 4
  floor_threshold: 0.02
  ceiling_tau: 0.9

deviations:
  - "Z60 ladder removed (D1)"
  - "no per-family learning-rate sweep (D2)"
  - "parameter-matched head-dimension confound accepted (D3)"
  - "budget from P1b; controls and baselines at T in {4, 8}; L=1 baselines reuse Tesseract K=1 (D4)"
  - "test on best and final checkpoints after training only (D4)"

residual_stream_confound:
  # Open question Q2, with the measurements that answer part of it.
  # Measured on an untrained medium-width model, 256 validation inputs,
  # runs/phase2/batch01/arm2a_residual_norms/residual_norms_report.json
  status: unresolved
  measurement:
    step0_validation_loss_nats:      # symptom
      fix_off: {k1: 4.4262, k2: 5.5024, k4: 10.1537, k8: 33.9691}
      fix_on:  {k1: 4.2569, k2: 4.2569, k4: 4.2568, k8: 4.2568}
    hidden_state_z_L_rms_per_step:   # the confound itself
      k8_fix_off: [1.43, 3.00, 4.86, 7.16, 10.09, 13.89, 18.83, 25.30]
      k8_fix_on:  [1.43, 3.00, 4.86, 7.16, 10.09, 13.89, 18.83, 25.30]
      growth_ratio_k8: 17.7
  finding: >-
    The output-side LayerNorm does NOT remove the residual-stream confound. It
    normalises the read-out only and never touches the recursion, so the hidden
    state grows identically with the fix on and off (17.7x from the first
    recursion step to the eighth at K=8). Equal step-0 loss under the fix is a
    property of the construction, not evidence that the confound is gone: a
    normalisation immediately before the vocabulary projection makes step-0 loss
    K-invariant whatever the hidden state is doing. Batch 01 Arm 2b therefore
    tests whether the read-out normalisation changes learnability; it does not
    and cannot establish that the confound has been removed.
  applies_to_all_families: true      # verified: tesseract, unrolled, param_matched, width_scaled
  per_family_added_parameters:
    tesseract: 512       # 2 x d_model 256
    unrolled: 512
    param_matched: 176   # 2 x d_model 88
    width_scaled: 512
  parameter_matching_with_fix:
    tesseract_k8: 837948
    param_matched_k8: 837148
    relative_difference: -0.00095
    within_one_percent: true
    note: >-
      match_parameters solves for d_model without accounting for the LayerNorm,
      so the residual -0.10 % drift is inherited rather than corrected. It is
      inside the 1 % tolerance the family tests enforce, but if the fix is
      activated the matching solver should include the LayerNorm cost.
  options_if_the_confound_must_actually_be_removed:
    - id: per_step_normalisation
      text: >-
        Normalise z_L inside the recursion, at every execution. This is where
        the growth occurs, so it is the only option that addresses it directly.
        It changes the recursion and therefore the function the block computes,
        and would need its own recorded decision and a re-baseline.
    - id: scaled_residual_update
      text: >-
        Scale the residual update by 1/K or 1/sqrt(K). Removes the growth but
        introduces a new K-dependent term into the function, which is the axis
        under test.
    - id: report_as_confound
      text: >-
        Keep the architecture and report the growth wherever a K effect is
        claimed. The current and weakest position.

pending_p1b: "model width (model_base) and fixed step budget (max_steps), plus the baseline sizes and runtimes that follow from them"
